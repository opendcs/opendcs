plugins {
    id 'opendcs.java-conventions'
    id 'opendcs.deps-conventions'
    id 'opendcs.sonar-conventions'
}


dependencies {
    implementation project(":opendcs")
    implementation project(":lrgs-web")
    implementation project(":testing:fixtures")
    implementation (libs.bundles.junit.platform)
    implementation(libs.bundles.junit)
    
    testImplementation enforcedPlatform(libs.junit.bom)
    testImplementation(libs.bundles.junit)
    testRuntimeOnly (libs.bundles.junit.platform)
    testImplementation(libs.ch.qos.logback)
    testRuntimeOnly(libs.io.opentelemetry.instrumentation.logback.mdc)
    testRuntimeOnly(libs.io.opentelemetry.instrumentation.logback.mdc)
    testImplementation(project(":opendcs-logback-event-provider"))
    testImplementation(libs.commons.io)
    testImplementation(libs.apache.derby)
    testImplementation(libs.io.github.hakky54)
    testImplementation(libs.webcompere.system.stubs.jupiter)
    testImplementation(libs.io.netty)
    testImplementation(libs.rest.assured)
}

test {
    jvmArgs += "-Djava.security.manager=allow"

    def tmpdir = "${project.layout.buildDirectory.get()}/runs/test/tmp"
    doFirst {
        project.mkdir(tmpdir)
    }
    jvmArgs += "-Djava.io.tmpdir=${tmpdir}"
    jvmArgs += "-Dlogback.configurationFile=${projectDir}/src/test/test-config/logback.xml"
    jvmArgs += "-DAPP_NAME=lrgs-tests"
}

jacocoTestReport {
    dependsOn test
    additionalSourceDirs files(project(":opendcs").sourceSets.main.java.srcDirs)
    //additionalClassDirs files(project(":opendcs").sourceSets.main.output)
    sourceSets project(":opendcs").sourceSets.main
    def excludes = [
                "**/easy_install/**",
                "**/python_packages",
                "**/certifi/**",
                "**/chardet/**",
                "**/urllib3/**",
                "**/requests/**",
                "**/chardet/**",
                "**/urllib3/**",
                "**/idna/**",
                "**/pkg_resources/**",
                "**/decodes/**",
                "**/covesw/**"
            ]

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: excludes)
        }))
    }
}
